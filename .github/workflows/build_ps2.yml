name: Build Godot PS2 Export Template

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone Godot Engine at Specific Commit
        run: |
          git init .
          git remote add origin https://github.com/godotengine/godot.git
          git fetch origin 3cd3caab6779a7f3ec3bbeb9f200db50c735cfc8 --depth=1
          git checkout FETCH_HEAD

      - name: Checkout godot-ps2 into platform/ps2
        uses: actions/checkout@v4
        with:
          path: platform/ps2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t godot-ps2:latest -f platform/ps2/Dockerfile .

      - name: Start Docker Compose
        run: |
          docker compose -f platform/ps2/docker-compose.yml up -d

      - name: Run SCons inside Container
        run: |
          docker exec -t godot-ps2-compiler sh -c 'scons platform=ps2'

      - name: Archive Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-ps2-export-template
          path: |
            bin/
          if-no-files-found: warn

      - name: Stop Docker Containers
        if: always()
        run: |
          docker compose -f platform/ps2/docker-compose.yml down || true