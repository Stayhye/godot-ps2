name: Build Godot PS2 Export Template

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone Godot Engine at Specific Commit
        run: |
          git init .
          git remote add origin https://github.com/godotengine/godot.git
          git fetch origin 3cd3caab6779a7f3ec3bbeb9f200db50c735cfc8 --depth=1
          git checkout FETCH_HEAD

      - name: Checkout godot-ps2 into platform/ps2
        uses: actions/checkout@v4
        with:
          path: platform/ps2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('platform/ps2/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker Image with Cache
        uses: docker/build-push-action@v5
        with:
          context: .
          file: platform/ps2/Dockerfile
          tags: godot-ps2:latest
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move Cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Run SCons inside Container
        run: |
          # Mounts the full workspace root (containing SConstruct and platform/ps2) into /godot
          docker run --rm -v ${{ github.workspace }}:/godot godot-ps2:latest sh -c 'scons platform=ps2 -j$(nproc)'

      - name: Archive Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-ps2-export-template
          path: |
            bin/
          if-no-files-found: warn